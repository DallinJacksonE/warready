name: warready
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-warready}
      MYSQL_USER: ${MYSQL_USER:-warready}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-warready}
      MYSQL_USER: ${MYSQL_USER:-warready}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      ADMIN1_USERNAME: ${ADMIN1_USERNAME:-dj}
      ADMIN1_NAME: ${ADMIN1_NAME:-DJ}
      ADMIN1_PASSWORD: ${ADMIN1_PASSWORD:?Set ADMIN1_PASSWORD in .env}
      ADMIN2_USERNAME: ${ADMIN2_USERNAME:-brother}
      ADMIN2_NAME: ${ADMIN2_NAME:-Brother}
      ADMIN2_PASSWORD: ${ADMIN2_PASSWORD:?Set ADMIN2_PASSWORD in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_PORT:-8080}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
volumes:
  mysql_data:
